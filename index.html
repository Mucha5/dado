<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@600&display=swap" rel="stylesheet">
<title>DADO</title>
<style>
  body {
    font-family: system-ui, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 40px 20px;
    min-height: 100vh;
  }
  .container {
    max-width: 500px;
    margin: 0 auto;
    background: #1e293b;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 {
    color: #f8fafc;
    margin-bottom: 30px;
  }
  .code {
    background: #0f172a;
    padding: 20px;
    border-radius: 8px;
    font-family: "Courier New", monospace;
    font-size: 1.3em;
    letter-spacing: 1px;
    margin: 20px 0;
  }
  .answer-box {
    margin-top: 30px;
  }
  input[type="text"] {
    padding: 12px 16px;
    font-size: 1.1em;
    border: none;
    border-radius: 8px;
    width: 200px;
    background: #0f172a;
    color: white;
    text-transform: uppercase;
  }
  button {
    padding: 12px 24px;
    font-size: 1.1em;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-left: 10px;
  }
  button:hover {
    background: #2563eb;
  }
  #result {
    margin-top: 20px;
    font-size: 1.3em;
    font-weight: bold;
    min-height: 40px;
  }
  .success { color: #4ade80; }
  .fail { color: #f87171; }
  #mamut-page {
    display: none;
    text-align: center;
    max-width: 900px;
    margin: 0 auto;
  }
  #mamut-page h1 {
    font-size: 4em;
    color: #f8fafc;
    margin-bottom: 30px;
    text-transform: uppercase;
    letter-spacing: 5px;
  }
  #mamut-page video { max-width: 94%; max-height: 70vh; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); background: #000; }
  #mamut-page img {
    max-width: 90%;
    height: auto;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .tagline { font-size: 1.6em; font-weight: 800; letter-spacing: 3px; color: #f8fafc; text-align: center; margin: 36px 0 10px; }
  .stage { position: relative; width: 320px; height: 360px; margin: 0 auto 40px; }
  .photo-slot { position: absolute; left: 50%; top: 50%; width: 190px; height: 190px; transform: translate(-50%,-50%); border: 2px dashed #64748b; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.9em; overflow: hidden; background: rgba(15,23,42,0.6); }
  .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
  .q { position: absolute; color: #fff; font-weight: 800; font-family: Georgia, 'Times New Roman', serif; line-height: 1; user-select: none; text-shadow: 0 4px 14px rgba(0,0,0,0.5); }
  .q1 { font-size: 120px; left: 0; top: 0; transform: rotate(-14deg); }
  .q2 { font-size: 90px; right: 6px; top: 6px; transform: rotate(12deg); opacity: .95; }
  .q3 { font-size: 105px; left: 6px; bottom: -4px; transform: rotate(10deg); }
  .q4 { font-size: 125px; right: 0; bottom: -10px; transform: rotate(-8deg); }
  .hint { margin-top: 14px; font-size: 0.7em; color: #94a3b8; }

  #qbg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  #qbg span { position: absolute; color: #fff; font-weight: 800; font-family: Georgia, 'Times New Roman', serif; line-height: 1; text-shadow: 0 4px 14px rgba(0,0,0,0.4); }
  #puzzle-page, #mamut-page { position: relative; z-index: 1; }

  .tagline { margin: 34px auto 6px; padding: 18px 28px 20px; max-width: 360px; text-align: center; background: rgba(15,23,42,0.88); border: 1px solid rgba(147,197,253,0.35); border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.45); letter-spacing: normal; font-size: 1em; }
  .tagline .t1 { display: block; font-family: 'Poppins', system-ui, sans-serif; font-weight: 600; font-size: 1.05em; letter-spacing: 8px; text-transform: uppercase; color: #cbd5e1; margin-bottom: 4px; }
  .tagline .t2 { display: block; font-family: 'Bungee', 'Arial Black', Impact, sans-serif; font-size: 4.2em; line-height: 1; letter-spacing: 6px; background: linear-gradient(180deg, #ffffff 0%, #93c5fd 55%, #3b82f6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 12px rgba(59,130,246,0.55)); }

  .photo-slot { width: 200px !important; height: 280px !important; border: 3px solid #f8fafc !important; border-radius: 10px !important; box-shadow: 0 12px 30px rgba(0,0,0,0.55); background: #0f172a !important; }
  .photo-slot img { object-position: center 15%; }
  .stage { height: 400px !important; width: 340px !important; }

  #heads { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .fh { position: absolute; left: var(--x); width: var(--s); bottom: -140px; animation: fly var(--t) linear var(--d) infinite; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  @keyframes fly {
    0%   { transform: translate(0,0) rotate(calc(var(--r) * -1)); }
    25%  { transform: translate(40px,-30vh) rotate(var(--r)); }
    50%  { transform: translate(-30px,-65vh) rotate(calc(var(--r) * -1.3)); }
    75%  { transform: translate(35px,-100vh) rotate(var(--r)); }
    100% { transform: translate(-10px,-130vh) rotate(calc(var(--r) * -1)); }
  }

  body.win .fh { animation: none !important; bottom: auto !important; left: 0 !important; top: 0; opacity: 0.35; will-change: transform; }
  body.win { background: #000 !important; }
  body.win #qbg { display: none !important; }
  #fw { position: fixed; inset: 0; z-index: 50; background: #000; display: none; }
  #fw canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #fw .cong { position: absolute; left: 0; right: 0; top: 42%; text-align: center; font-family: 'Bungee', 'Poppins', sans-serif; font-size: min(11vw, 64px); line-height: 1.1; color: #fff; text-shadow: 0 0 20px #fbbf24, 0 0 40px #f59e0b; animation: pop 1.2s ease-out both; padding: 0 10px; }
  #fw .cong small { display: block; font-size: 0.4em; margin-top: 12px; color: #fde68a; }
  @keyframes pop { 0% { transform: scale(0.2); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
  #mamut-page.show { animation: fadein 1.4s ease-out both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
</style>
</head>

<div id="mamut-page">
  <h1>Mamut</h1>
  <video id="winvid" src="video.mp4" controls playsinline preload="auto"></video>
</div>
<script>
function checkAnswer() {
  const input = document.getElementById("answer").value.trim().toUpperCase();
  const result = document.getElementById("result");
  if (input === "POLAND") {
    result.className = "success";
    result.innerHTML = "✅ Correct!";
    setTimeout(startWin, 500);
  } else if (input === "") {
    result.className = "";
    result.innerHTML = "";
  } else {
    result.className = "fail";
    result.innerHTML = "❌ Wrong password";
  }
}
document.getElementById("answer").addEventListener("keypress", function(e) {
  if (e.key === "Enter") checkAnswer();
});

function startWin() {
  document.body.classList.add("win");
  document.getElementById("puzzle-page").style.display = "none";
  
  var fw = document.getElementById("fw"); fw.style.display = "block";
  var c = document.getElementById("fwc"), ctx = c.getContext("2d");
  var dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  var ps = [], t0 = performance.now(), last = 0, nextBurst = 0, ended = false;
  var cols = [0, 20, 45, 120, 190, 280, 330];
  function burst(x, y) {
    var hue = cols[Math.floor(Math.random() * cols.length)], n = 70;
    for (var i = 0; i < n; i++) {
      var a = Math.PI * 2 * i / n, v = 1.5 + Math.random() * 3.5;
      ps.push({x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 1, h: hue + Math.random() * 30});
    }
  }
  function frame(now) {
    var el = now - t0;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.fillRect(0, 0, innerWidth, innerHeight);
    ctx.globalCompositeOperation = "lighter";
    if (el < 5200 && el > nextBurst) {
      burst(innerWidth * (0.15 + Math.random() * 0.7), innerHeight * (0.12 + Math.random() * 0.45));
      nextBurst = el + 280 + Math.random() * 350;
    }
    for (var i = ps.length - 1; i >= 0; i--) {
      var p = ps[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.045; p.vx *= 0.99; p.l -= 0.011;
      if (p.l <= 0) { ps.splice(i, 1); continue; }
      ctx.fillStyle = "hsla(" + p.h + ",100%,60%," + p.l + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 6.283); ctx.fill();
    }
    if (el < 6200) { requestAnimationFrame(frame); }
    else { reveal(); }
  }
  function reveal() {
    if (ended) return;
    ended = true;
    fw.style.transition = "opacity 0.9s"; fw.style.opacity = 0;
    var m = document.getElementById("mamut-page");
    m.style.display = "block"; m.classList.add("show"); var v = document.getElementById("winvid"); if (v) { var pr = v.play(); if (pr && pr.catch) pr.catch(function () { v.muted = true; v.play().catch(function () {}); }); }
    setTimeout(function () { fw.style.display = "none"; }, 1000);
  }
  setTimeout(reveal, 7000);
  requestAnimationFrame(frame);
}
(function () {
  var imgs = Array.prototype.slice.call(document.querySelectorAll(".fh"));
  var W = innerWidth, H = innerHeight;
  var st = imgs.map(function (el, i) {
    var w = el.offsetWidth || 80, hh = el.offsetHeight || 120;
    var a = Math.random() * 6.283, sp = 0.8 + Math.random() * 1.1;
    return {el: el, w: w, h: hh, x: Math.random() * (W - w), y: Math.random() * (H - hh), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: Math.random() * 40 - 20, vr: (Math.random() - 0.5) * 0.8};
  });
  addEventListener("resize", function () { W = innerWidth; H = innerHeight; });
  function tick() {
    if (!document.body.classList.contains('win')) { requestAnimationFrame(tick); return; }
    st.forEach(function (s) {
      s.x += s.vx; s.y += s.vy; s.r += s.vr;
      if (s.x < 0) { s.x = 0; s.vx = Math.abs(s.vx); s.vr = -s.vr; }
      if (s.x > W - s.w) { s.x = W - s.w; s.vx = -Math.abs(s.vx); s.vr = -s.vr; }
      if (s.y < 0) { s.y = 0; s.vy = Math.abs(s.vy); s.vr = -s.vr; }
      if (s.y > H - s.h) { s.y = H - s.h; s.vy = -Math.abs(s.vy); s.vr = -s.vr; }
      s.el.style.transform = "translate(" + s.x + "px," + s.y + "px) rotate(" + s.r + "deg)";
    });
    requestAnimationFrame(tick);
  }
  tick();
})();
